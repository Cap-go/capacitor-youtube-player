appId: app.capgo.youtube.player
---
- launchApp
- tapOn: "Native UI projection (native only)"
- tapOn: "Initialize Player"
- extendedWaitUntil:
    visible:
      text: "Status: ready"
    timeout: 120000
- tapOn: "Show Web overlay"
- assertVisible: "Web overlay"
- tapOn: "Dismiss"
- assertNotVisible: "Web overlay"