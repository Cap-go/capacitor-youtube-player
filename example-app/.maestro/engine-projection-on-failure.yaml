appId: app.capgo.youtube.player
---
- launchApp
- tapOn: "Native UI projection (native only)"
- tapOn: "Initialize Player"
- extendedWaitUntil:
    visible:
      text: "Status: ready"
    timeout: 120000
- scrollUntilVisible:
    element:
      text: "Show Web overlay"
    direction: DOWN
- tapOn: "Show Web overlay"
- assertVisible: "Web overlay"
- tapOn: "Trigger plugin error"
- assertVisible: "Player frame must be at least 200x200 CSS pixels"
- tapOn: "Destroy Player"
- assertVisible:
    text: "Status: not initialised"