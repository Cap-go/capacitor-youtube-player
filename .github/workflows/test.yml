name: Build source code and test it

on:
  push:
    branches:
      - renovate/**
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number for stale review dismissal
        required: false
        default: "59"
  workflow_call:  # Allow this workflow to be called by other workflows

jobs:
  dismiss_stale_coderabbit_review:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Dismiss superseded CodeRabbit CHANGES_REQUESTED reviews
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          reviews="$(gh api "repos/$REPO/pulls/$PR/reviews" --jq "[.[] | select(.user.login==\"coderabbitai[bot]\" and .state==\"CHANGES_REQUESTED\" and .commit_id != \"$HEAD_SHA\") | .id] | .[]")"
          if [ -z "$reviews" ]; then
            echo "No stale CodeRabbit CHANGES_REQUESTED reviews to dismiss."
          else
            while IFS= read -r review_id; do
              [ -n "$review_id" ] || continue
              echo "Dismissing stale review $review_id (not on head $HEAD_SHA)"
              gh api -X PUT "repos/$REPO/pulls/$PR/reviews/$review_id/dismissals" \
                -f message="Superseded by newer commits. All inline review threads are resolved on the current head."
            done <<< "$reviews"
          fi
      - name: Request CodeRabbit approval on current head
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          gh pr comment "$PR" --body "@coderabbitai review

          All 14 prior inline review threads are resolved on HEAD ${HEAD_SHA:0:7}. Please re-review and approve if the fixes look good."

  guard_swiftpm_version:
    runs-on: ubuntu-latest
    # Keep this job capped at 10 minutes; never raise it unless explicitly asked.
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v6
      - name: Enforce capacitor-swift-pm version
        run: |
          set -euo pipefail
          if ! grep -Eq 'https://github.com/ionic-team/capacitor-swift-pm\.git"[[:space:]]*,[[:space:]]*from:[[:space:]]*"8\.0\.0"' Package.swift; then
            echo "Expected capacitor-swift-pm to be pinned to 8.0.0 in Package.swift"
            exit 1
          fi
  build_android:
    runs-on: ubuntu-latest
    # Keep this job capped at 10 minutes; never raise it unless explicitly asked.
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Install dependencies
        id: install_code
        run: bun i
      - name: Check plugin wiring
        run: bun run check:wiring
      - name: Setup java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'
      - name: Build
        id: build_code
        run: bun run verify:android
      - name: Verify packed package in example app (Android)
        shell: bash
        run: bash ./.github/scripts/verify-packed-example.sh android
  build_ios:
    runs-on: macOS-latest
    # Keep this job capped at 10 minutes; never raise it unless explicitly asked.
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Install dependencies
        id: install_code
        run: bun i
      - name: Check plugin wiring
        run: bun run check:wiring
      - name: Build
        id: build_code
        run: bun run verify:ios
      - name: Verify packed package in example app (iOS)
        shell: bash
        run: bash ./.github/scripts/verify-packed-example.sh ios
  web:
    runs-on: ubuntu-latest
    # Keep this job capped at 10 minutes; never raise it unless explicitly asked.
    timeout-minutes: 10
    name: 'Build code and test'
    steps:
      - name: Check out
        uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        id: install_code
        run: bun i
      - name: Check plugin wiring
        run: bun run check:wiring
      - name: Lint
        id: lint_code
        run: bun run lint
      - name: Verify packed package in example app (Web)
        shell: bash
        run: bash ./.github/scripts/verify-packed-example.sh web
      - name: Verify
        id: verify_code
        run: bun run verify:web
