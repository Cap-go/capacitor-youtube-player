name: Dismiss stale bot reviews

on:
  pull_request:
    types: [synchronize]

permissions:
  pull-requests: write

jobs:
  dismiss-stale-coderabbit-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dismiss superseded CodeRabbit CHANGES_REQUESTED reviews
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          reviews="$(gh api "repos/$REPO/pulls/$PR/reviews" --jq "[.[] | select(.user.login==\"coderabbitai[bot]\" and .state==\"CHANGES_REQUESTED\" and .commit_id != \"$HEAD_SHA\") | .id] | .[]")"
          if [ -z "$reviews" ]; then
            echo "No stale CodeRabbit CHANGES_REQUESTED reviews to dismiss."
            exit 0
          fi
          while IFS= read -r review_id; do
            [ -n "$review_id" ] || continue
            echo "Dismissing stale review $review_id (not on head $HEAD_SHA)"
            gh api -X PUT "repos/$REPO/pulls/$PR/reviews/$review_id/dismissals" \
              -f message="Superseded by newer commits on the PR branch. CodeRabbit may re-review the current head."
          done <<< "$reviews"

      - name: Request CodeRabbit approval on current head
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR" --body "@coderabbitai approve"
